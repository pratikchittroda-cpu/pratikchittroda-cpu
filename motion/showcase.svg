<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Ten animated interface motion experiments</title>
  <desc id="desc">A dark navy, cyan, and violet motion playground with ten distinct animations: pulse, sweep, orbit, radar, wave, equalizer, terminal, particles, border flow, and twinkle.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".7" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="frame"><rect x="2" y="2" width="1196" height="326" rx="28" /></clipPath>
  </defs>

  <rect width="1200" height="330" rx="28" fill="#0d1117" />
  <rect x="2" y="2" width="1196" height="326" rx="28" fill="url(#surface)" stroke="#1e3a5f" />
  <g clip-path="url(#frame)">
    <circle cx="1040" cy="-45" r="230" fill="#0891b2" opacity=".08">
      <animate attributeName="r" values="210;240;210" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="145" cy="360" r="210" fill="#7c3aed" opacity=".06">
      <animate attributeName="r" values="190;225;190" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="34" y="36" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">MOTION SYSTEM / 10 EXPERIMENTS</text>
  <text x="1166" y="36" text-anchor="end" fill="#64748b" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">PRATIK / LAB</text>

  <!-- 01 Pulse -->
  <g transform="translate(24 58)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">01 / PULSE</text>
    <circle cx="108" cy="67" r="11" fill="#22d3ee" filter="url(#softGlow)">
      <animate attributeName="r" values="8;15;8" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values=".55;1;.55" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="108" cy="67" r="25" fill="none" stroke="#22d3ee" stroke-opacity=".25">
      <animate attributeName="r" values="15;38;15" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values=".55;0;.55" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 02 Sweep -->
  <g transform="translate(246 58)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">02 / SWEEP</text>
    <g opacity=".2" stroke="#38bdf8"><path d="M18 52H198M18 67H198M18 82H198" /></g>
    <rect x="18" y="48" width="34" height="4" rx="2" fill="url(#cyanShine)">
      <animate attributeName="x" values="18;164;18" dur="2.8s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="63" width="58" height="4" rx="2" fill="url(#cyanShine)">
      <animate attributeName="x" values="-44;164;-44" dur="3.6s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="78" width="25" height="4" rx="2" fill="url(#cyanShine)">
      <animate attributeName="x" values="18;175;18" dur="2.3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 03 Orbit -->
  <g transform="translate(468 58)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">03 / ORBIT</text>
    <circle cx="108" cy="67" r="25" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-dasharray="3 6" />
    <circle cx="108" cy="67" r="7" fill="#a78bfa" filter="url(#softGlow)" />
    <g>
      <circle cx="133" cy="67" r="5" fill="#22d3ee" />
      <animateTransform attributeName="transform" type="rotate" from="0 108 67" to="360 108 67" dur="3.4s" repeatCount="indefinite" />
    </g>
    <g>
      <circle cx="83" cy="67" r="3" fill="#38bdf8" />
      <animateTransform attributeName="transform" type="rotate" from="360 108 67" to="0 108 67" dur="2.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- 04 Radar -->
  <g transform="translate(690 58)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">04 / RADAR</text>
    <circle cx="108" cy="67" r="30" fill="none" stroke="#22d3ee" stroke-opacity=".22" />
    <circle cx="108" cy="67" r="19" fill="none" stroke="#22d3ee" stroke-opacity=".2" />
    <path d="M108 67L108 37A30 30 0 0 1 134 52Z" fill="#22d3ee" opacity=".35" transform-origin="108px 67px">
      <animateTransform attributeName="transform" type="rotate" from="0 108 67" to="360 108 67" dur="3s" repeatCount="indefinite" />
    </path>
    <circle cx="127" cy="53" r="3" fill="#f8fafc"><animate attributeName="opacity" values="0;.9;0" dur="3s" repeatCount="indefinite" /></circle>
  </g>

  <!-- 05 Wave -->
  <g transform="translate(912 58)">
    <rect width="264" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">05 / WAVE</text>
    <path d="M18 69 C35 41 52 97 69 69 S103 41 120 69 S154 97 171 69 S205 41 222 69 S239 97 256 69" fill="none" stroke="url(#cyanViolet)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- 06 Equalizer -->
  <g transform="translate(24 186)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">06 / EQUALIZER</text>
    <g fill="url(#cyanViolet)">
      <rect x="62" y="60" width="10" height="20" rx="5"><animate attributeName="height" values="14;38;20;30;14" dur="1.7s" repeatCount="indefinite" /><animate attributeName="y" values="66;42;60;50;66" dur="1.7s" repeatCount="indefinite" /></rect>
      <rect x="82" y="52" width="10" height="28" rx="5"><animate attributeName="height" values="34;16;42;24;34" dur="1.4s" repeatCount="indefinite" /><animate attributeName="y" values="46;64;38;56;46" dur="1.4s" repeatCount="indefinite" /></rect>
      <rect x="102" y="42" width="10" height="38" rx="5"><animate attributeName="height" values="42;20;30;48;42" dur="1.9s" repeatCount="indefinite" /><animate attributeName="y" values="38;60;50;32;38" dur="1.9s" repeatCount="indefinite" /></rect>
      <rect x="122" y="56" width="10" height="24" rx="5"><animate attributeName="height" values="20;44;14;34;20" dur="1.5s" repeatCount="indefinite" /><animate attributeName="y" values="60;36;66;46;60" dur="1.5s" repeatCount="indefinite" /></rect>
      <rect x="142" y="48" width="10" height="32" rx="5"><animate attributeName="height" values="30;14;42;22;30" dur="1.8s" repeatCount="indefinite" /><animate attributeName="y" values="50;66;38;58;50" dur="1.8s" repeatCount="indefinite" /></rect>
    </g>
  </g>

  <!-- 07 Terminal -->
  <g transform="translate(246 186)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">07 / TERMINAL</text>
    <text x="26" y="66" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700">&gt; ship()</text>
    <rect x="115" y="51" width="9" height="18" rx="2" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></rect>
    <text x="26" y="87" fill="#64748b" font-family="monospace" font-size="10">status: iterating</text>
  </g>

  <!-- 08 Particles -->
  <g transform="translate(468 186)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">08 / PARTICLES</text>
    <g fill="#22d3ee">
      <circle cx="72" cy="78" r="4"><animate attributeName="cy" values="78;45;78" dur="2.4s" repeatCount="indefinite" /><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite" /></circle>
      <circle cx="108" cy="80" r="3" fill="#a78bfa"><animate attributeName="cy" values="80;39;80" dur="2.9s" repeatCount="indefinite" /><animate attributeName="opacity" values=".2;.9;.2" dur="2.9s" repeatCount="indefinite" /></circle>
      <circle cx="145" cy="74" r="5" fill="#38bdf8"><animate attributeName="cy" values="74;50;74" dur="2.1s" repeatCount="indefinite" /><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite" /></circle>
    </g>
    <path d="M58 84 Q108 28 164 84" fill="none" stroke="#334155" stroke-dasharray="2 7" />
  </g>

  <!-- 09 Border flow -->
  <g transform="translate(690 186)">
    <rect width="216" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">09 / BORDER FLOW</text>
    <rect x="58" y="48" width="100" height="38" rx="19" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <circle cx="108" cy="67" r="5" fill="#a78bfa"><animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite" /></circle>
  </g>

  <!-- 10 Twinkle -->
  <g transform="translate(912 186)">
    <rect width="264" height="112" rx="20" fill="#111c2e" stroke="#263d5c" />
    <text x="18" y="24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">10 / TWINKLE</text>
    <g fill="url(#cyanViolet)" filter="url(#softGlow)">
      <path d="M72 51l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite" /></path>
      <path d="M132 45l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite" /></path>
      <path d="M190 62l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite" /></path>
    </g>
  </g>
</svg>
