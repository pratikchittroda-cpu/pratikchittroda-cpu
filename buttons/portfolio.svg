<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio — View the lab</title>
  <desc id="desc">A rounded animated button linking to Pratik's portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".65" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="210" height="44" rx="22" fill="#7c3aed" opacity=".45" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;.6;.25" dur="3.2s" repeatCount="indefinite" />
  </rect>
  <rect x="2" y="2" width="216" height="50" rx="25" fill="url(#bg)" stroke="#c4b5fd" stroke-opacity=".65" />
  <g transform="skewX(-18)" opacity=".28">
    <rect x="-55" y="2" width="36" height="50" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="290 0" dur="3.8s" repeatCount="indefinite" />
    </rect>
  </g>
  <circle cx="29" cy="27" r="15" fill="#f5f3ff" fill-opacity=".14" />
  <text x="29" y="33" text-anchor="middle" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">✦</text>
  <text x="53" y="33" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">View the lab</text>
</svg>
