<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" role="img" aria-labelledby="title desc">
  <title id="title">GitHub — Follow the build</title>
  <desc id="desc">A rounded animated button linking to Pratik's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".6" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="210" height="44" rx="22" fill="#0f172a" opacity=".7" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;.7;.35" dur="3.4s" repeatCount="indefinite" />
  </rect>
  <rect x="2" y="2" width="216" height="50" rx="25" fill="url(#bg)" stroke="#64748b" stroke-opacity=".7" />
  <clipPath id="clip"><rect x="2" y="2" width="216" height="50" rx="25" /></clipPath>
  <g clip-path="url(#clip)" transform="skewX(-18)" opacity=".25">
    <rect x="-55" y="2" width="36" height="50" rx="18" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="290 0" dur="3.6s" repeatCount="indefinite" />
    </rect>
  </g>
  <circle cx="29" cy="27" r="15" fill="#f8fafc" fill-opacity=".12" />
  <text x="29" y="32" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="700">GH</text>
  <text x="53" y="33" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15" font-weight="700">Follow the build</text>
</svg>
