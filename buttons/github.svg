<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" role="img" aria-labelledby="title desc">
  <title id="title">GitHub — Follow the build</title>
  <desc id="desc">A rounded animated button linking to Pratik's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".6" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="pill"><rect width="220" height="54" rx="27" /></clipPath>
  </defs>
  <rect width="220" height="54" fill="#0d1117" />
  <rect width="220" height="54" rx="27" fill="url(#bg)" stroke="#64748b" stroke-opacity=".7">
    <animate attributeName="stroke-opacity" values=".5;.9;.5" dur="3.4s" repeatCount="indefinite" />
  </rect>
  <g clip-path="url(#pill)">
    <g transform="skewX(-18)" opacity=".25">
      <rect x="-55" width="36" height="54" fill="url(#shine)">
        <animateTransform attributeName="transform" type="translate" from="-20 0" to="290 0" dur="3.6s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
  <circle cx="29" cy="27" r="15" fill="#f8fafc" fill-opacity=".12" />
  <text x="29" y="32" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="700">GH</text>
  <text x="53" y="33" fill="#f8fafc" font-family="Arial, sans-serif" font-size="15" font-weight="700">Follow the build</text>
</svg>
