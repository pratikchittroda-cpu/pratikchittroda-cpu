<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" role="img" aria-labelledby="title desc">
  <title id="title">Expenzo — Source code</title>
  <desc id="desc">A rounded animated button linking to the Expenzo source code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3b6e" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".65" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="210" height="44" rx="22" fill="#38bdf8" opacity=".4" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;.6;.25" dur="3.3s" repeatCount="indefinite" />
  </rect>
  <rect x="2" y="2" width="216" height="50" rx="25" fill="url(#bg)" stroke="#7dd3fc" stroke-opacity=".7" />
  <g transform="skewX(-18)" opacity=".28">
    <rect x="-55" y="2" width="36" height="50" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="290 0" dur="3.7s" repeatCount="indefinite" />
    </rect>
  </g>
  <circle cx="29" cy="27" r="15" fill="#e0f2fe" fill-opacity=".14" />
  <text x="29" y="32" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="12" font-weight="700">&lt;/&gt;</text>
  <text x="53" y="33" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="15" font-weight="700">Source code</text>
</svg>
