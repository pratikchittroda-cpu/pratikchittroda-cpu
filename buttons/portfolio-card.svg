<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio Card — Live demo</title>
  <desc id="desc">A rounded animated button linking to the Portfolio Card demo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".65" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="pill"><rect width="220" height="54" rx="27" /></clipPath>
  </defs>
  <rect width="220" height="54" fill="#0d1117" />
  <rect width="220" height="54" rx="27" fill="url(#bg)" stroke="#ddd6fe" stroke-opacity=".72">
    <animate attributeName="stroke-opacity" values=".5;.9;.5" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <g clip-path="url(#pill)">
    <g transform="skewX(-18)" opacity=".28">
      <rect x="-55" width="36" height="54" fill="url(#shine)">
        <animateTransform attributeName="transform" type="translate" from="-20 0" to="290 0" dur="3.6s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
  <circle cx="29" cy="27" r="15" fill="#f5f3ff" fill-opacity=".15" />
  <text x="29" y="33" text-anchor="middle" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="19" font-weight="700">↗</text>
  <text x="53" y="33" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Live demo</text>
</svg>
