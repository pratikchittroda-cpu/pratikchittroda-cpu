name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github-dark
            output/github-contribution-grid-snake.gif?palette=github-dark

      - name: Publish generated assets
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: refresh contribution snake"
          add: "output/*.svg output/*.gif"
