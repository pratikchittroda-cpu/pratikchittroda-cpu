<text x="4" y="52" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">06</text>
<text x="52" y="54" fill="#E2E8F0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="1">open a channel</text>
<text x="358" y="53" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">// say hi</text>
