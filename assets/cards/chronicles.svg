<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-labelledby="t d">
<title id="t">Chronicles of ∞ — infinite adventure engine</title>
<desc id="d">A choose-your-own-adventure that never runs out of chapters. Built with TypeScript, Gemini.</desc>
