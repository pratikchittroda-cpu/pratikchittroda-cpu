      <circle cx="-92" cy="0" r="5" fill="#E2E8F0"><animate attributeName="r" values="4;8;4" dur="2s" begin="0s" repeatCount="indefinite"/></circle><circle cx="92" cy="0" r="5" fill="#E2E8F0"><animate attributeName="r" values="4;8;4" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle><circle cx="0" cy="0" r="5" fill="#E2E8F0"><animate attributeName="r" values="4;8;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
