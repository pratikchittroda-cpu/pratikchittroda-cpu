    <text x="28" y="152" fill="#94A3B8" font-size="15">A choose-your-own-adventure</text><text x="28" y="174" fill="#94A3B8" font-size="15">that never runs out of chapters.</text>
    <rect x="28" y="206" width="92" height="22" rx="6" fill="#111832" stroke="#1E293B"/><text x="74" y="221" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">TypeScript</text><rect x="128" y="206" width="62.400000000000006" height="22" rx="6" fill="#111832" stroke="#1E293B"/><text x="159.2" y="221" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">Gemini</text>
